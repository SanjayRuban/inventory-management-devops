<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f6f8;
    }
    h1 { margin-bottom: 8px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    input, button {
      padding: 10px;
      margin: 5px 3px;
    }
    input { width: 150px; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 5px;
      background: #222;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    .delete { background: #c62828; }
    #message { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Inventory Management System</h1>
  <p>Simple Node.js + Express + MySQL CRUD application</p>

  <div class="card">
    <h2>Add Product</h2>
    <form id="productForm">
      <input id="name" placeholder="Product name" required>
      <input id="category" placeholder="Category" required>
      <input id="price" type="number" step="0.01" placeholder="Price" required>
      <input id="quantity" type="number" placeholder="Quantity" required>
      <input id="reorder_level" type="number" placeholder="Reorder level">
      <button type="submit">Add Product</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="card">
    <h2>Products</h2>
    <button onclick="loadProducts()">Refresh</button>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Reorder Level</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <script>
    const API = "http://localhost:5000/api/products";

    async function loadProducts() {
      const response = await fetch(API);
      const products = await response.json();

      document.getElementById("productTable").innerHTML = products.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>${p.category}</td>
          <td>${p.price}</td>
          <td>${p.quantity}</td>
          <td>${p.reorder_level}</td>
          <td>
            <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const product = {
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: Number(document.getElementById("price").value),
        quantity: Number(document.getElementById("quantity").value),
        reorder_level: Number(document.getElementById("reorder_level").value || 0)
      };

      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(product)
      });

      const data = await response.json();

      document.getElementById("message").textContent =
        response.ok ? "Product added successfully." : data.message;

      if (response.ok) {
        e.target.reset();
        loadProducts();
      }
    });

    async function deleteProduct(id) {
      const response = await fetch(`${API}/${id}`, { method: "DELETE" });
      const data = await response.json();
      alert(data.message);
      loadProducts();
    }

    loadProducts();
  </script>
</body>
</html>
