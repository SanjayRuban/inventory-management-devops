<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Management System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      background: linear-gradient(135deg, #eef2f7, #f8fafc);
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .header p {
      color: #666;
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d5d9df;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .add-btn {
      margin-top: 12px;
    }

    .cancel-btn {
      background: #777;
      display: none;
      margin-top: 12px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-row input {
      flex: 1;
    }

    .refresh-btn {
      background: #444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #f1f3f5;
      font-weight: bold;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
    }

    tr:hover {
      background: #fafafa;
    }

    .edit {
      background: #555;
      margin-right: 5px;
    }

    .delete {
      background: #c62828;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 8px;
      }
    }

    @media (max-width: 500px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .search-row {
        flex-direction: column;
      }

      .header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Inventory Management System</h1>
      <p>Manage products, stock levels and inventory operations</p>
    </div>

    <!-- Add / Update Product -->
    <div class="card">
      <h2 id="formTitle">Add Product</h2>

      <form id="productForm">

        <div class="form-grid">

          <input
            id="name"
            placeholder="Product name"
            required
          >

          <input
            id="category"
            placeholder="Category"
            required
          >

          <input
            id="price"
            type="number"
            step="0.01"
            placeholder="Price"
            required
          >

          <input
            id="quantity"
            type="number"
            placeholder="Quantity"
            required
          >

          <input
            id="reorder_level"
            type="number"
            placeholder="Reorder level"
          >

        </div>

        <button
          type="submit"
          class="add-btn"
          id="submitBtn"
        >
          Add Product
        </button>

        <button
          type="button"
          class="cancel-btn"
          id="cancelBtn"
          onclick="cancelEdit()"
        >
          Cancel
        </button>

      </form>

      <div id="message"></div>
    </div>


    <!-- Products -->
    <div class="card">

      <h2>Products</h2>

      <div class="search-row">

        <input
          id="searchInput"
          placeholder="🔍 Search by product name or category..."
          oninput="searchProducts()"
        >

        <button
          class="refresh-btn"
          onclick="loadProducts()"
        >
          🔄 Refresh
        </button>

      </div>

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Reorder Level</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="productTable"></tbody>

      </table>

    </div>

  </div>


  <script>

    // Your Render API
    const API =
      "https://inventory-management-latest-ewc1.onrender.com/api/products";

    let products = [];
    let editingId = null;


    // Load products
    async function loadProducts() {

      try {

        const response = await fetch(API);

        products = await response.json();

        displayProducts(products);

      } catch (error) {

        document.getElementById("message").textContent =
          "Failed to load products.";

        console.error(error);
      }
    }


    // Display products
    function displayProducts(data) {

      document.getElementById("productTable").innerHTML =
        data.map(p => `

          <tr>

            <td>${p.id}</td>

            <td>${p.name}</td>

            <td>${p.category}</td>

            <td>₹${Number(p.price).toFixed(2)}</td>

            <td>${p.quantity}</td>

            <td>${p.reorder_level}</td>

            <td>

              <button
                class="edit"
                onclick="editProduct(${p.id})"
              >
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteProduct(${p.id})"
              >
                Delete
              </button>

            </td>

          </tr>

        `).join("");

    }


    // Search
    function searchProducts() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();

      const filtered = products.filter(p =>
        p.name.toLowerCase().includes(search) ||
        p.category.toLowerCase().includes(search)
      );

      displayProducts(filtered);
    }


    // Add / Update
    document
      .getElementById("productForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();

        const product = {

          name:
            document.getElementById("name").value,

          category:
            document.getElementById("category").value,

          price:
            Number(document.getElementById("price").value),

          quantity:
            Number(document.getElementById("quantity").value),

          reorder_level:
            Number(
              document.getElementById("reorder_level").value || 0
            )

        };


        try {

          let response;

          if (editingId === null) {

            // ADD
            response = await fetch(API, {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify(product)

            });

          } else {

            // UPDATE
            response = await fetch(
              `${API}/${editingId}`,
              {

                method: "PUT",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify(product)

              }
            );

          }


          const data = await response.json();


          if (response.ok) {

            document.getElementById("message").textContent =
              editingId === null
                ? "Product added successfully."
                : "Product updated successfully.";

            e.target.reset();

            editingId = null;

            document.getElementById("formTitle").textContent =
              "Add Product";

            document.getElementById("submitBtn").textContent =
              "Add Product";

            document.getElementById("cancelBtn").style.display =
              "none";

            loadProducts();

          } else {

            document.getElementById("message").textContent =
              data.message || "Operation failed.";

          }

        } catch (error) {

          document.getElementById("message").textContent =
            "Server connection failed.";

          console.error(error);

        }

      });


    // Edit product
    function editProduct(id) {

      const product =
        products.find(p => p.id === id);

      if (!product) return;


      editingId = id;


      document.getElementById("name").value =
        product.name;

      document.getElementById("category").value =
        product.category;

      document.getElementById("price").value =
        product.price;

      document.getElementById("quantity").value =
        product.quantity;

      document.getElementById("reorder_level").value =
        product.reorder_level;


      document.getElementById("formTitle").textContent =
        "Update Product";

      document.getElementById("submitBtn").textContent =
        "Update Product";

      document.getElementById("cancelBtn").style.display =
        "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    // Cancel update
    function cancelEdit() {

      editingId = null;

      document.getElementById("productForm").reset();

      document.getElementById("formTitle").textContent =
        "Add Product";

      document.getElementById("submitBtn").textContent =
        "Add Product";

      document.getElementById("cancelBtn").style.display =
        "none";

      document.getElementById("message").textContent = "";

    }


    // Delete
    async function deleteProduct(id) {

      if (!confirm("Are you sure you want to delete this product?")) {
        return;
      }


      try {

        const response =
          await fetch(`${API}/${id}`, {

            method: "DELETE"

          });


        const data =
          await response.json();


        alert(data.message);

        loadProducts();

      } catch (error) {

        alert("Failed to delete product.");

        console.error(error);

      }

    }


    // Initial load
    loadProducts();

  </script>

</body>
</html>
